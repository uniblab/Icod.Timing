name: release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CONFIGURATION: Release

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            7.0.x
            8.0.x
            9.0.x
            10.0.x
      - name: Require tagged commit in main
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if (0 -ne $LASTEXITCODE) {
              throw "Tag commit is not contained in main."
          }
      - id: version
        name: Validate tag and package version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?)$') {
              throw 'Unsupported release tag.'
          }
          $version = $Matches.version
          $projectVersion = (dotnet msbuild Icod.Timing.csproj -nologo -getProperty:PackageVersion).Trim()
          if ($projectVersion -ne $version) {
              throw "Tag $version does not match PackageVersion $projectVersion."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - run: dotnet restore Icod.Timing.sln
      - run: dotnet build Icod.Timing.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true
      - run: dotnet test Icod.Timing.sln -c Release --no-build --no-restore --logger trx
      - run: dotnet pack Icod.Timing.csproj -c Release --no-build --no-restore -o artifacts/release -p:ContinuousIntegrationBuild=true
      - name: Verify exact Release package
        shell: pwsh
        run: ./packaging/VerifyPackageArtifact.ps1 -ArtifactDirectory artifacts/release -Configuration Release -ExpectedVersion '${{ steps.version.outputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: icod-timing-release-packages
          path: |
            artifacts/release/*.nupkg
            artifacts/release/*.snupkg
          if-no-files-found: error
          retention-days: 7

  publish-nuget:
    needs: package
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: icod-timing-release-packages
          path: artifacts/package
      - id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          Get-ChildItem artifacts/package -Filter '*.nupkg' -File | ForEach-Object {
              dotnet nuget push $_.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
              if (0 -ne $LASTEXITCODE) {
                  throw "NuGet publication failed for '$($_.Name)'."
              }
          }

  publish-github-packages:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: icod-timing-release-packages
          path: artifacts/package
      - name: Publish to GitHub Packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: |
          $source = "https://nuget.pkg.github.com/$env:GITHUB_OWNER/index.json"
          Get-ChildItem artifacts/package -Filter '*.nupkg' -File | ForEach-Object {
              dotnet nuget push $_.FullName --api-key $env:GITHUB_TOKEN --source $source --skip-duplicate
              if (0 -ne $LASTEXITCODE) {
                  throw "GitHub Packages publication failed for '$($_.Name)'."
              }
          }

  github-release:
    needs: [package, publish-nuget, publish-github-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: icod-timing-release-packages
          path: artifacts/release-assets
      - name: Create checksums and release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assetDirectory = 'artifacts/release-assets'
          $files = @(Get-ChildItem -LiteralPath $assetDirectory -File | Sort-Object Name)
          $lines = foreach ($file in $files) {
              $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($file.Name)"
          }
          [System.IO.File]::WriteAllLines(
              (Join-Path $assetDirectory 'SHA256SUMS.txt'),
              $lines,
              [System.Text.UTF8Encoding]::new($false)
          )

          $arguments = @(
              'release', 'create', $env:GITHUB_REF_NAME,
              '--verify-tag',
              '--title', "Icod.Timing ${{ needs.package.outputs.version }}",
              '--generate-notes'
          )
          if ('true' -eq '${{ needs.package.outputs.prerelease }}') {
              $arguments += '--prerelease'
              $arguments += '--latest=false'
          }
          $arguments += @(
              Get-ChildItem -LiteralPath $assetDirectory -File |
                  Sort-Object Name |
                  ForEach-Object { $_.FullName }
          )

          & gh @arguments
          if (0 -ne $LASTEXITCODE) {
              throw "GitHub Release creation failed with status $LASTEXITCODE."
          }
